services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: byggspor
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d byggspor"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile.migrate
    volumes:
      - ./backend:/backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/byggspor
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  test-db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: byggspor_test
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d byggspor_test"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    profiles:
      - test

volumes:
  pgdata:
